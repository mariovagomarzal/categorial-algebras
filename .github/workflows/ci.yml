# Builds the paper, the library and its API documentation on pushes to main and on pull requests
# to main.
# Only a push to main publishes the site to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main always finishes, so that it saves its caches and publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # In a job of its own, so that the TeX Live image and Mathlib do not share the runner's disk.
  paper:
    name: Build the paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile the paper
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: main.tex

      - name: Keep the PDF for the site
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/main.pdf
          if-no-files-found: error

  build:
    name: Build the library and the documentation
    needs: paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the library
        uses: leanprover/lean-action@v1

      # The documentation of the dependencies (Mathlib's, above all) and the packages that only
      # doc-gen4 needs, with their builds: rebuilding them, which compiles C code, would make Lake
      # document every module again, and so would a change of the bibliography, which is part of
      # the key. These packages are those of docbuild's manifest that are not in the library's.
      # The pages of the library are written again on every run.
      - name: Find the packages of doc-gen4
        id: docs-paths
        run: |
          {
            echo "paths<<EOF"
            echo docbuild/.lake/build
            jq -r --slurpfile lib lake-manifest.json \
              '[$lib[0].packages[].name] as $own | .packages[]
               | select(.type == "git" and (.name as $n | $own | index($n) | not))
               | ".lake/packages/" + (.name | ltrimstr("«") | rtrimstr("»"))' \
              docbuild/lake-manifest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Restore the documentation of the dependencies
        id: docs-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.docs-paths.outputs.paths }}
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'paper/references.bib') }}

      - name: Build the documentation
        run: scripts/build-docs.sh

      # Only main saves it, so that pull requests never evict main's caches.
      - name: Save the documentation of the dependencies
        if: github.event_name == 'push' && steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.docs-paths.outputs.paths }}
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}

      - name: Add the paper to the site
        uses: actions/download-artifact@v8
        with:
          name: paper
          path: _site

      - name: Name the PDF of the paper
        run: mv _site/main.pdf _site/paper.pdf

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
