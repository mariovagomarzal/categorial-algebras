# Builds the library and its API documentation on pushes to main and on pull requests to main.
# Only a push to main publishes the site to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main always finishes, so that it saves its caches and publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The documentation of the dependencies (Mathlib's, above all) and the build of doc-gen4. They
  # only change with the toolchain and the manifest; the pages of the library are written again
  # on every run.
  DOCS_CACHE_PATHS: |
    docbuild/.lake/build
    .lake/packages/doc-gen4
    .lake/packages/leansqlite
    .lake/packages/UnicodeBasic
    .lake/packages/BibtexQuery
    .lake/packages/MD4Lean

jobs:
  build:
    name: Build the library and the documentation
    runs-on: ubuntu-latest
    steps:
      # Mathlib fills most of the runner's disk. The toolchains of Android, .NET and Haskell,
      # which nothing here uses, are removed in the background while the job goes on.
      - name: Make room on the disk
        run: |
          sudo nohup rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            > /dev/null 2>&1 &

      - uses: actions/checkout@v5

      - name: Build the library
        uses: leanprover/lean-action@v1

      - name: Restore the documentation of the dependencies
        id: docs-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # doc-gen4 documents many modules of Mathlib in parallel, which exhausts the memory of the
      # runner on a build without cache. More swap lets it finish.
      - name: Add swap
        run: |
          # The runner's temporary disk, if it has one, so as not to fill the main one.
          dir=/mnt; [ -d "$dir" ] || dir=
          sudo fallocate -l 16G "$dir/docs.swap"
          sudo chmod 600 "$dir/docs.swap"
          sudo mkswap "$dir/docs.swap" > /dev/null
          sudo swapon "$dir/docs.swap"
          free -h

      - name: Build the documentation
        run: scripts/build-docs.sh

      # Only main saves it, so that pull requests never evict main's caches.
      - name: Save the documentation of the dependencies
        if: github.event_name == 'push' && steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DOCS_CACHE_PATHS }}
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
