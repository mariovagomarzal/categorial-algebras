# Builds the library and its API documentation on pushes to main and on pull requests to main.
# Only a push to main publishes the site to GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main always finishes, so that it saves its caches and publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the library and the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the library
        uses: leanprover/lean-action@v1

      # The documentation of the dependencies (Mathlib's, above all), which only changes with the
      # toolchain and the manifest. The pages of the library are written again on every run, and
      # doc-gen4 itself is built on every run (about a minute), as in docgen-action.
      - name: Restore the documentation of the dependencies
        id: docs-cache
        uses: actions/cache/restore@v5
        with:
          path: docbuild/.lake/build
          key: docs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Build the documentation
        run: scripts/build-docs.sh

      # Only main saves it, so that pull requests never evict main's caches.
      - name: Save the documentation of the dependencies
        if: github.event_name == 'push' && steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: docbuild/.lake/build
          key: ${{ steps.docs-cache.outputs.cache-primary-key }}

      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
