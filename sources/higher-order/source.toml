title = "Higher-order categorial algebras"
phase = "planning"
scope = """
Research in progress (draft by Climent Vidal, Cosme Llópez, Ruiz Mora and Vago Marzal), \
kept in `main.tex`, the reference document: every result of the library is checked against it, \
and the refs of this plan follow its numbering. Section 1 is the introduction (prerequisites, \
notation and terminology); Sections 2–13 are the body of the draft. Appendices A (many-sorted \
sets and algebras) and B (many-sorted partial algebras) are reference material for completing \
definitions the body leaves out; where they overlap the body (Section 3 and Appendix A on \
derivors, Definition 2.4 and Appendix B on QE-equations) the body prevails. First scope: \
Section 2 (preliminaries: words, many-sorted sets, signatures, partial algebras and \
QE-equations), Section 7 (compact presentation: compact n-categories, many-sorted compact \
n-categorial algebras and their category, and their QE specification), Section 8 (extended \
presentation and its algebras), then Section 10 (truncation and discretization of algebras) and \
Sections 11–12 (ωCatAlg as a projective limit). Definitions are refined where the draft is wrong \
or incomplete; every refinement is recorded in the item's `reason` or in the prose. Sections 3–6 \
(Hall algebras, derivors), 9 (graduation and unification) and 13 (algebraic squares) are out of \
this first scope."""
reuse = """
The categorial core is ported from the group's repository \
https://github.com/mariovagomarzal/higher_category_theory (Apache 2.0; authors Cosme Llópez, \
Ruiz Mora, Vago Marzal): its single-sorted presentation is the compact one, its many-sorted \
presentation the extended one. Mathlib for partial functions (`Part`, `PFun`) and for category \
theory (`CategoryTheory.Category`, functors, limits). Mathlib has no many-sorted universal \
algebra and no strict n-categories, so signatures and algebras are the library's own."""
conventions = """
A signature on sorts `S` is `List S → S → Type`. An n-category is indexed by `Fin n` in the \
compact presentation and by `Fin (n + 1)` in the extended one, as in the ported repository. \
Composition is a partial operation `C → C →. C` whose domain is exactly the composable pairs."""
