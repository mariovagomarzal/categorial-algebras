title = "Higher-order categorial algebras"
phase = "planning"
scope = """
Research in progress (draft by Climent Vidal, Cosme Llópez, Ruiz Mora and Vago Marzal), \
kept in `main.tex`, the reference document: every result of the library is checked against it. \
Its body (Sections 1–11) is the draft, with its numbering, which the refs of this plan use; \
Appendices A (many-sorted sets and algebras) and B (many-sorted partial algebras) are reference \
material for completing definitions the body leaves out, and where they overlap the body (Section 2 \
and Appendix A on derivors, Definition 1.2 and Appendix B on QE-equations) the body prevails. First scope: Section 5 (compact presentation: \
compact n-categories, many-sorted compact n-categorial algebras and their category), Section 6 \
(extended presentation and its algebras), then Section 8 (truncation and discretization of \
algebras) and Sections 9–10 (ωCatAlg as a projective limit). Definitions are refined where the \
draft is wrong or incomplete; every refinement is recorded in the item's `reason` or in the \
prose. Sections 2–4 (Hall algebras, derivors) and 11 are out of this first scope. The QE \
specifications (Defs. 5.6, 6.5) wait until partial-algebra machinery exists."""
reuse = """
The categorial core is ported from the group's repository \
https://github.com/mariovagomarzal/higher_category_theory (Apache 2.0; authors Cosme Llópez, \
Ruiz Mora, Vago Marzal): its single-sorted presentation is the compact one, its many-sorted \
presentation the extended one. Mathlib for partial functions (`Part`, `PFun`) and for category \
theory (`CategoryTheory.Category`, functors, limits). Mathlib has no many-sorted universal \
algebra and no strict n-categories, so signatures and algebras are the library's own."""
conventions = """
A signature on sorts `S` is `List S → S → Type`. An n-category is indexed by `Fin n` in the \
compact presentation and by `Fin (n + 1)` in the extended one, as in the ported repository. \
Composition is a partial operation `C → C →. C` whose domain is exactly the composable pairs."""
